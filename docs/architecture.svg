<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/></marker>
  </defs>
  <rect width="1000" height="520" rx="16" fill="#0b1220"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#e2e8f0">GhostShell Architecture</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">One fake company. Every service shares the same fake users, files and credentials.</text>

  <!-- Attacker -->
  <g>
    <rect x="30" y="110" width="170" height="70" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="115" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#fca5a5">ATTACKER</text>
    <text x="115" y="162" text-anchor="middle" font-size="12" fill="#fecaca">any password works</text>
  </g>
  <!-- SSH -->
  <g>
    <rect x="280" y="90" width="200" height="60" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <text x="380" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#93c5fd">SSH Honeypot :2222</text>
    <text x="380" y="136" text-anchor="middle" font-size="12" fill="#bfdbfe">Paramiko server</text>
  </g>
  <!-- Admin panel -->
  <g>
    <rect x="280" y="170" width="200" height="60" rx="12" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <text x="380" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#d8b4fe">Fake Admin Panel :8081</text>
    <text x="380" y="216" text-anchor="middle" font-size="12" fill="#e9d5ff">Acme Corp portal</text>
  </g>
  <!-- AWS metadata -->
  <g>
    <rect x="280" y="250" width="200" height="60" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
    <text x="380" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#fcd34d">Fake AWS Metadata</text>
    <text x="380" y="296" text-anchor="middle" font-size="12" fill="#fde68a">same fake AWS key</text>
  </g>
  <!-- Fake shell -->
  <g>
    <rect x="560" y="130" width="200" height="90" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="660" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#86efac">Fake Shell + Filesystem</text>
    <text x="660" y="182" text-anchor="middle" font-size="12" fill="#bbf7d0">AI shell (Ollama) + honeytokens</text>
    <text x="660" y="200" text-anchor="middle" font-size="12" fill="#bbf7d0">aws_credentials.txt · id_rsa</text>
  </g>
  <!-- DB -->
  <g>
    <rect x="560" y="280" width="200" height="60" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="660" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">SQLite Database</text>
    <text x="660" y="326" text-anchor="middle" font-size="12" fill="#94a3b8">sessions · commands · hits</text>
  </g>
  <!-- Dashboard -->
  <g>
    <rect x="30" y="390" width="280" height="70" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <text x="170" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#93c5fd">Live Dashboard :5000</text>
    <text x="170" y="440" text-anchor="middle" font-size="12" fill="#bfdbfe">stats · replay · MITRE · rules · IOC</text>
  </g>
  <!-- Profiler -->
  <g>
    <rect x="360" y="390" width="280" height="70" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="2"/>
    <text x="500" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4">Profiler + Rule Generator</text>
    <text x="500" y="440" text-anchor="middle" font-size="12" fill="#99f6e4">MITRE ATT&amp;CK · Sigma · Suricata</text>
  </g>
  <!-- IOC -->
  <g>
    <rect x="690" y="390" width="280" height="70" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="830" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#86efac">Defence Output</text>
    <text x="830" y="440" text-anchor="middle" font-size="12" fill="#bbf7d0">Sigma · Suricata · /api/ioc feed</text>
  </g>

  <!-- Arrows -->
  <line x1="200" y1="130" x2="275" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="150" x2="275" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="170" x2="275" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="120" x2="555" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="200" x2="555" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="280" x2="555" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="220" x2="660" y2="275" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="620" y1="340" x2="300" y2="390" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="340" x2="500" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="410" x2="685" y2="410" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="500" y="500" text-anchor="middle" font-size="12" fill="#64748b">Run only on your own lab machine. All secrets in GhostShell are fake.</text>
</svg>
